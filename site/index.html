<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1f6feb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Konnichiwa"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="icons/icon-32.png"><title>Konnichiwa</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Plus+Jakarta+Sans:wght@500;700;800&family=M+PLUS+Rounded+1c:wght@500;800&display=swap"></head><body><style>:root{
  --blue:#1f6feb;--blue-d:#1557c7;--blue-dd:#0d3a93;--sky:#edf3ff;--sky-2:#dde8fd;--amber:#ffa90a;--amber-d:#f08a00;--amber-l:#fff1d1;
  --navy:#0f1b3d;--ink-2:#4b5a7c;--ink-3:#8e9ab6;--red:#e8452c;--green:#20a464;--card:#fff;--line:#e3ebf9;
  --c:#e8452c;--r-xl:32px;--r-lg:26px;--r-md:20px;--r-sm:14px;
  --shadow:0 14px 34px -16px rgba(13,58,147,.42);--shadow-sm:0 6px 16px -8px rgba(13,58,147,.32);
  --ease:cubic-bezier(.2,.85,.25,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font:"Plus Jakarta Sans","M PLUS Rounded 1c","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
  --jp:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--navy);font-family:var(--font);font-size:15px;line-height:1.5;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.jpf{font-family:var(--jp)}
#app{position:relative;max-width:480px;margin:0 auto;height:100%;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--sky)}
.view.in-r{animation:inR .4s var(--ease) both}.view.out-l{animation:outL .4s var(--ease) both}
.view.in-l{animation:inL .4s var(--ease) both}.view.out-r{animation:outR .4s var(--ease) both}
.view.in-f{animation:inF .32s var(--ease) both}
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}@keyframes outL{to{transform:translateX(-26%);opacity:.6}}
@keyframes inL{from{transform:translateX(-26%);opacity:.6}to{transform:none}}@keyframes outR{to{transform:translateX(100%)}}
@keyframes inF{from{opacity:.55;transform:scale(.985)}to{opacity:1;transform:none}}
.rise{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms)}
@keyframes rise{from{transform:translateY(18px) scale(.97);opacity:.35}to{transform:none;opacity:1}}

/* manga lettering */
.manga{font-family:var(--display);color:var(--amber);letter-spacing:.01em;line-height:1;text-transform:uppercase;
  text-shadow:3px 0 #fff,-3px 0 #fff,0 3px #fff,0 -3px #fff,2px 2px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff,0 8px 0 var(--blue-dd),3px 8px 0 var(--blue-dd),-3px 8px 0 var(--blue-dd)}
.manga em{font-style:normal;color:#ff6a2b}

/* sunburst blue hero */
.hero{position:relative;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 54px;color:#fff;overflow:hidden;
  background:repeating-conic-gradient(from 0deg at 70% 110%,rgba(255,255,255,.09) 0 6deg,transparent 6deg 14deg),radial-gradient(120% 90% at 70% 110%,#4a90ff 0,var(--blue) 45%,var(--blue-d) 100%)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 1.1px,transparent 1.4px);background-size:9px 9px;mask-image:linear-gradient(200deg,#000,transparent 60%);-webkit-mask-image:linear-gradient(200deg,#000,transparent 60%);pointer-events:none}
.hero>*{position:relative;z-index:2}
.clouds{position:absolute!important;left:0;right:0;bottom:-1px;height:46px;z-index:3!important;pointer-events:none}
.clouds svg{width:100%;height:100%;display:block}
.hero .art{position:absolute;z-index:1;right:-10px;bottom:20px;width:72%;max-width:330px;aspect-ratio:2/1;object-fit:cover;object-position:right center;mask-image:linear-gradient(90deg,transparent,#000 35%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%)}
.hero .kanji{position:absolute;right:16px;bottom:30px;z-index:1;font-family:var(--display);font-size:92px;line-height:1;color:rgba(255,255,255,.16)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.04em}
.iconbtn{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--blue);display:grid;place-items:center;flex:none;box-shadow:var(--shadow-sm)}
.iconbtn svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(255,255,255,.2);color:#fff;white-space:nowrap}
.pill.am{background:var(--amber);color:var(--navy)}
.hero h1{font-family:var(--display);font-weight:400;font-size:27px;line-height:1.18;margin:0;text-wrap:balance;max-width:16ch;text-shadow:0 3px 0 rgba(13,58,147,.5)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9;margin-bottom:6px}
.sub{opacity:.92;margin-top:8px;font-size:14px;max-width:30ch}

/* home */
.home-hero{padding-bottom:0;min-height:420px;display:flex;flex-direction:column}
.home-hero .manga{font-size:46px;margin:8px 0 0;transform:rotate(-4deg);transform-origin:left;max-width:100%}
.home-hero .topbar{position:relative;z-index:5}.home-hero .stage{position:relative;flex:none;margin:-74px -20px 0;aspect-ratio:900/1023;min-height:300px}
.home-hero .stage img{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;object-position:center top}.home-hero .stage::after{content:'';position:absolute;inset:0 0 auto;height:120px;z-index:1;background:linear-gradient(rgba(13,58,147,.55),transparent)}
.home-hero .stage .ph{position:absolute;inset:0;display:grid;place-items:end center}
.home-hero .stage .ph svg{width:80%;max-width:330px}
.welcome{position:relative;z-index:4;margin:-34px 16px 0;background:#fff;border-radius:var(--r-lg);padding:18px 20px;box-shadow:var(--shadow);text-align:center}
.welcome b{display:block;font-size:19px;line-height:1.3;font-weight:800}
.welcome small{color:var(--ink-2)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--blue);width:18px;border-radius:9px}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 32px);margin:12px 16px 0;padding:17px;border-radius:20px;background:var(--amber);color:var(--navy);font-weight:800;font-size:16px;box-shadow:0 8px 0 -2px var(--amber-d),var(--shadow-sm);transition:transform .2s var(--spring)}
.cta:active{transform:translateY(3px);box-shadow:0 4px 0 -2px var(--amber-d)}
.cta svg{width:20px;height:20px}
.banner{position:relative;overflow:hidden;margin:18px 16px 0;border-radius:var(--r-lg);padding:18px;background:repeating-conic-gradient(from 0deg at 85% 120%,rgba(255,255,255,.18) 0 7deg,transparent 7deg 15deg),linear-gradient(135deg,#ffc23a,var(--amber));color:var(--navy);box-shadow:var(--shadow-sm);display:flex;gap:14px;align-items:center;text-align:left;width:calc(100% - 32px)}
.banner .bt{flex:1;min-width:0}
.banner small{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.banner b{display:block;font-family:var(--display);font-weight:400;font-size:20px;line-height:1.2;margin:2px 0 4px}
.banner span{font-size:13px;font-weight:600}
.banner .go{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--blue);color:#fff;padding:8px 14px;border-radius:999px;font-weight:800;font-size:13px}
.banner .go svg{width:15px;height:15px}
.banner .fox,.banner img{width:86px;flex:none;filter:drop-shadow(0 6px 8px rgba(160,80,0,.25))}
.catbar{display:flex;gap:4px;overflow-x:auto;margin:18px 16px 0;padding:6px;border-radius:20px;background:var(--amber);box-shadow:var(--shadow-sm);scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.catbar button{flex:none;padding:9px 14px;border-radius:14px;font-weight:800;font-size:14px;color:#fff;white-space:nowrap}
.catbar button.on{background:#fff;color:var(--navy)}
.section-t{display:flex;align-items:center;justify-content:space-between;margin:24px 16px 12px}
.section-t h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.01em}
.section-t span{color:var(--ink-3);font-size:13px;font-weight:600}
.days{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.dcard{position:relative;text-align:left;background:#fff;border-radius:var(--r-md);padding:8px 8px 12px;box-shadow:var(--shadow-sm);transition:transform .25s var(--spring);overflow:hidden}
.dcard:active{transform:scale(.96)}
.dcard .pic{position:relative;height:96px;border-radius:14px;overflow:hidden;background:repeating-conic-gradient(from 0deg at 50% 120%,rgba(255,255,255,.14) 0 7deg,transparent 7deg 15deg),linear-gradient(160deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c))}
.dcard .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% center}
.dcard .pic .k{position:absolute;right:6px;bottom:-8px;font-family:var(--display);font-size:46px;color:rgba(255,255,255,.4)}
.dcard .pic .no{position:absolute;left:8px;top:8px;background:#fff;color:var(--navy);font-weight:800;font-size:11px;padding:3px 8px;border-radius:999px;z-index:1}
.dcard .chg{position:absolute;right:14px;top:14px;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--red);box-shadow:var(--shadow-sm);z-index:1}
.dcard .chg svg{width:14px;height:14px}
.dcard .t{font-weight:800;font-size:14px;line-height:1.25;margin:10px 4px 4px}
.dcard .m{display:flex;justify-content:space-between;align-items:center;margin:0 4px;font-size:12.5px}
.dcard .m b{color:var(--amber-d)}
.dcard .m span{color:var(--ink-3);font-weight:600}
.dcard.past{opacity:.6}
.dcard.now{box-shadow:0 0 0 3px var(--amber),var(--shadow)}

/* day */
.dayhero h1{font-size:24px;max-width:15ch}
.daymeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.toolbar{display:flex;gap:8px;padding:6px 16px 2px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);font-size:13px;font-weight:800;color:var(--navy)}
.chip svg{width:16px;height:16px;color:var(--blue)}
.chip.on{background:var(--blue);color:#fff}.chip.on svg{color:#fff}
.tasks{margin:12px 16px 0;background:#fff;border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow-sm)}
.tasks h3{margin:0 0 4px;font-size:12px;letter-spacing:.08em;color:var(--blue);text-transform:uppercase;font-weight:800}
.task{display:flex;gap:10px;align-items:flex-start;padding:7px 0;width:100%;text-align:left;font-size:14px;font-weight:600}
.task .cb{width:22px;height:22px;border-radius:7px;border:2.5px solid var(--sky-2);flex:none;display:grid;place-items:center;transition:all .25s var(--spring)}
.task.on .cb{background:var(--green);border-color:var(--green);transform:scale(1.08)}
.task.on .cb::after,.opt.on .cb::after{content:"";width:10px;height:6px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:rotate(-45deg) translate(1px,-1px)}
.task.on span{color:var(--ink-3);text-decoration:line-through}
.tl{padding:16px 16px 10px}
.row{display:grid;grid-template-columns:62px 1fr;gap:8px;align-items:start}
.time{padding-top:16px;text-align:right;font-weight:800;font-size:14px;white-space:nowrap;line-height:1.1;color:var(--blue-d)}
.time small{display:block;font-weight:600;font-size:11px;color:var(--ink-3);margin-top:4px}
.card{position:relative;width:100%;text-align:left;background:#fff;border-radius:var(--r-md);padding:12px 14px 12px 12px;box-shadow:var(--shadow-sm);display:flex;gap:12px;align-items:flex-start;transition:transform .2s var(--spring)}
.card:active{transform:scale(.98)}
.bub{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 14%,#fff);color:var(--k);overflow:hidden}
.bub svg{width:24px;height:24px}
.bub.dish{background:#faf6eb;overflow:hidden}
.sprite{display:block;width:100%;height:100%;background-repeat:no-repeat;background-size:400% 400%}
.card .body{min-width:0;flex:1}
.card .nm{font-weight:800;font-size:15.5px;line-height:1.25}
.card .jp{font-family:var(--jp);font-size:12px;color:var(--ink-3);margin-top:1px}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:var(--sky);color:var(--ink-2);white-space:nowrap}
.tag.m{background:#ffe5df;color:#c7341d}.tag.n{background:var(--amber-l);color:#a65f00}.tag.s{background:#eef0f5;color:#6c7590}
.tag.fx{background:var(--blue);color:#fff}
.tag.warn{background:var(--red);color:#fff;animation:pulse 1.6s ease-in-out infinite}
.tag.soft{background:#ffe0a3;color:#8a4b00}
.tag.ok{background:#dcf5e8;color:#127a48}
@keyframes pulse{50%{transform:scale(1.06)}}
.card.done{opacity:.7}
.card.cur{box-shadow:0 0 0 3px var(--amber),var(--shadow)}
.card.cur::before{content:"今";font-family:var(--jp);position:absolute;left:-13px;top:-11px;width:30px;height:30px;border-radius:50%;background:var(--amber);color:var(--navy);font-size:14px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px #fff}
.hanko{position:absolute;right:10px;top:8px;width:48px;height:48px;border:3px solid var(--red);border-radius:50%;color:var(--red);display:grid;place-items:center;font-family:var(--jp);font-weight:800;font-size:21px;transform:rotate(-14deg);background:rgba(255,255,255,.75)}
.hanko.new{animation:stamp .5s var(--spring) both}
@keyframes stamp{0%{transform:scale(2.4) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-14deg)}}
.leg{display:grid;grid-template-columns:62px 1fr;gap:8px;margin:3px 0}
.leg .line{justify-self:end;width:3px;margin-right:9px;background-image:linear-gradient(var(--blue) 55%,transparent 0);background-size:3px 9px;opacity:.35;min-height:48px}
.leg .lb{display:flex;align-items:center;gap:9px;padding:9px 2px;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.leg .mi{width:32px;height:32px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none;color:#fff;box-shadow:0 0 0 4px var(--sky-2)}
.leg .mi svg{width:16px;height:16px}
.leg .lt{flex:1;min-width:0}.leg b{color:var(--navy)}
.leg .est{color:#a65f00;font-weight:800}
.leg a{flex:none;font-weight:800;font-size:12px;color:#fff;text-decoration:none;padding:7px 12px;border-radius:999px;background:var(--blue);display:inline-flex;gap:4px;align-items:center}
.leg a svg{width:13px;height:13px}
.leg .wait{display:block;color:var(--green);font-weight:800}
.ctrls{display:flex;gap:6px;margin:10px 0 6px 60px;flex-wrap:wrap}
.ctrl{padding:10px 14px;border-radius:14px;background:#fff;box-shadow:var(--shadow-sm);font-weight:800;font-size:13px;color:var(--blue-d)}
.ctrl.main{background:var(--amber);color:var(--navy);box-shadow:0 5px 0 -1px var(--amber-d)}
.ctrl:active{transform:translateY(2px)}
.skipcard{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--r-sm);border:2px dashed var(--sky-2);color:var(--ink-3);font-size:13px;font-weight:600;margin:4px 0}
.skipcard button{font-weight:800;color:var(--blue);font-size:13px}
.endnote{text-align:center;color:var(--ink-2);font-size:13px;font-weight:600;padding:10px 0 4px}
.endnote svg,.endnote img{width:84px;display:block;margin:4px auto}

/* reorder */
.rlist{padding:12px 16px}
.rrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 10px 10px 12px;margin-bottom:8px;box-shadow:var(--shadow-sm);touch-action:pan-y}
.rrow .bub{width:36px;height:36px;border-radius:12px}.rrow .bub svg{width:19px;height:19px}
.rrow .nm{font-weight:800;font-size:14px;flex:1;min-width:0}
.rrow .nm small{display:block;font-weight:600;color:var(--ink-3);font-size:11.5px}
.grip{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--blue);background:var(--sky);touch-action:none;cursor:grab}
.grip svg{width:22px;height:22px}
.rrow.lock{background:#f6f9ff}.rrow.lock .grip{opacity:.45;background:none}
.rrow.sk{opacity:.5}
.rrow.ph{opacity:.4;border:2px dashed var(--blue);box-shadow:none}
.ghost{position:fixed;z-index:80;pointer-events:none;box-shadow:0 26px 40px -14px rgba(13,58,147,.5);transform:scale(1.04) rotate(-1.2deg)}
.hint{margin:12px 16px 0;padding:12px 14px;border-radius:16px;background:var(--amber-l);color:#7a4500;font-size:13px;font-weight:600}

/* detail: blue top, white sheet over it */
.dhero{padding-bottom:150px}
.dsheet{position:relative;z-index:4;margin:-136px 12px 0;background:#fff;border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden;padding-bottom:6px}
.dsheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0}
.dpic{position:relative;height:190px;margin:10px 12px 0;border-radius:24px;overflow:hidden;background:repeating-conic-gradient(from 0deg at 50% 120%,rgba(255,255,255,.16) 0 7deg,transparent 7deg 15deg),linear-gradient(160deg,color-mix(in srgb,var(--c) 65%,#fff),var(--c));display:grid;place-items:center}
.dpic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dpic .sprite{width:170px;height:170px;margin:auto}
.dpic.food{background:#faf6eb}
.dpic .bigic{width:92px;height:92px;color:#fff;opacity:.95}
.dpic.food .bigic{color:var(--amber-d)}
.dpic .k{position:absolute;right:12px;bottom:-12px;font-family:var(--display);font-size:80px;color:rgba(255,255,255,.35)}
.badge{position:absolute;left:12px;top:12px;z-index:1;display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-size:12px;font-weight:800;box-shadow:var(--shadow-sm);color:var(--navy)}
.badge i{width:22px;height:22px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.badge.m i{background:var(--red)}.badge.n i{background:var(--amber)}.badge.s i{background:var(--ink-3)}.badge.fx i{background:var(--blue)}
.dtitle{padding:14px 18px 2px}
.dtitle .r{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--amber-d)}
.dtitle h2{margin:4px 0 0;font-size:23px;line-height:1.2;font-weight:800;text-wrap:balance}
.dtitle .jp{font-family:var(--jp);color:var(--ink-3);font-size:14px;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 8px}
.fact{background:var(--sky);border-radius:14px;padding:9px 10px}
.fact small{display:block;font-size:11px;color:var(--ink-3);font-weight:700}.fact b{font-size:17px;color:var(--blue-d)}
.seg{display:flex;gap:4px;margin:14px 16px 0;padding:6px;background:var(--amber);border-radius:20px;position:sticky;top:8px;z-index:6;box-shadow:var(--shadow-sm)}
.seg button{flex:1;padding:8px 4px;border-radius:14px;font-weight:800;font-size:13.5px;color:#fff;line-height:1.15}
.seg button small{display:block;font-size:10px;font-weight:600;font-family:var(--jp);opacity:.9}
.seg button.on{background:#fff;color:var(--navy)}
.pane{padding:14px 16px 0}
.pane .pc{animation:rise .4s var(--ease) both}
.box{background:#fff;border-radius:var(--r-md);padding:15px 16px;box-shadow:var(--shadow-sm);margin-bottom:12px}
.box h3{margin:0 0 8px;font-size:16px;font-weight:800}

      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }
        }

    };

function dragList(v, day) {

    const g = e.target.closest('[data-grip]'); if (!g) return; e.preventDefault();
    const row = g.closest('.rrow'), rect = row.getBoundingClientRect(), off = e.clientY - rect.top;
    const ghost = row.cloneNode(true); ghost.classList.add('ghost'); Object.assign(ghost.style, { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', margin: 0 }); document.body.appendChild(ghost);
    row.classList.add('ph'); g.setPointerCapture(e.pointerId);
    const move = ev => {

      const sibs = [...list.querySelectorAll('.rrow:not(.ph)')];
      let before = sibs.find(s => { const b = s.getBoundingClientRect(); return ev.clientY < b.top + b.height / 2; });

      const lastS = sibs[sibs.length - 1]; if (!before && ITEM[lastS.dataset.id].k === 'home') before = lastS;

const entryOrder = () => me && ENTRY[me] ? [me, ...PEOPLE.filter(p => p !== me)] : PEOPLE;
function showEntry(who) {
  document.querySelectorAll('.entry').forEach(e => e.remove());
  who = who || entryOrder()[0];
  const d = document.createElement('div'); d.className = 'entry';
  const paint = () => { d.innerHTML = `<div class="et"><small>Visit Japan Web</small><b>Immigration and customs</b></div><img src="entry/${who.toLowerCase()}.png" alt="Entry QR for ${esc(who)}"><div class="en">${esc(who)}</div><div class="ep">${esc(ENTRY[who])}</div><div class="eswitch">${entryOrder().map(p => `<button class="${p === who ? 'on' : ''}" data-who="${p}">${p}</button>`).join('')}</div><p class="eh">Turn the brightness up. Show this at immigration, then again at the customs kiosk.</p><button class="eclose" data-close>Close</button>`; };
  paint(); d.onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.who) { who = b.dataset.who; return paint(); } if (b.dataset.close != null) d.remove(); };
  document.body.appendChild(d);
}

// ---------- shopping (this phone only)
const SH = 'kitsune.shop';
const shop = () => store.get(SH) || [];
const yen = n => '¥' + Math.round(n).toLocaleString('en-US');
const INR = 0.60; // rupees per yen, fixed for the trip
const inr = n => '₹' + Math.round(n * INR).toLocaleString('en-IN');
function askPrice(id) {
  const L = shop(), it = L.find(x => x.id === id); if (!it) return;
  sheet(`<h2>${it.p != null ? 'Change the price' : 'Bought it!'}</h2><p>How much was <b>${esc(it.n)}</b>?</p><form class="priceform"><span>¥</span><input name="p" type="text" inputmode="numeric" pattern="[0-9,]*" placeholder="0" value="${it.p ?? ''}" autocomplete="off"></form><div class="pricehint num" data-inr>${it.p != null ? '≈ ' + inr(it.p) : '≈ ₹0'}</div><div class="actions" style="padding:12px 0 0">${it.p != null ? '<button class="btn" data-unbuy>Not bought</button>' : '<button class="btn" data-no>Cancel</button>'}<button class="btn pri" data-yes>Save</button></div>`, el => {
    const inp = el.querySelector('input'); setTimeout(() => inp.focus(), 350); const hint = el.querySelector('[data-inr]'); inp.oninput = () => { hint.textContent = '≈ ' + inr(+inp.value.replace(/[^0-9]/g, '') || 0); };
    const done = () => { const v = +inp.value.replace(/[^0-9]/g, ''); if (!inp.value.trim()) return toast('Enter the price in yen'); it.p = v; it.at = Date.now(); store.set(SH, L); closeSheet(); refresh(); toast(yen(v) + ' added'); };
    el.querySelector('form').onsubmit = e => { e.preventDefault(); done(); };
    el.querySelector('[data-yes]').onclick = done;
    const no = el.querySelector('[data-no]'); if (no) no.onclick = () => closeSheet();
    const ub = el.querySelector('[data-unbuy]'); if (ub) ub.onclick = () => { delete it.p; delete it.at; store.set(SH, L); closeSheet(); refresh(); };
  });
}

// ---------- boot
document.body.insertAdjacentHTML('beforeend', `<div class="tabs"><nav>${[['home', 'trip', 'Trip', '旅'], ['today', 'sun', 'Today', '今日'], ['wallet', 'wallet', 'Wallet', '券'], ['shop', 'bag', 'Shop', '買'], ['sync', 'sync', 'Sync', '同期']].map(t => `<button class="tab" data-t="${t[0]}"><span class="ti">${ic(t[1])}</span><span>${t[2]} ${t[3]}</span></button>`).join('')}</nav></div>`);
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return; const t = b.dataset.t;
  if (t === 'home') return root('home', { v: 'home' });
  if (t === 'today') { const d = todayDay() || DAYS[DAYS.length - 1]; return root('today', { v: 'day', id: d.id }); }
  if (t === 'wallet') return root('wallet', { v: 'wallet' });
  if (t === 'shop') return root('shop', { v: 'shop' });
  if (t === 'sync') return root('sync', { v: 'sync' });
});
root('home', { v: 'home' });
(() => { const N = parse(location.hash); if (N) { try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) { } offerImport(N); } else if (!me) setTimeout(() => pickMe(), 600); })();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script></body></html>
